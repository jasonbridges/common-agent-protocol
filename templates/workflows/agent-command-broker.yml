name: Agent GitHub App Command Broker

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  broker:
    name: Validate and author issue-scoped bot change
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == (vars.AGENT_BROKER_OWNER || github.repository_owner) &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/agent-commit-v1')
    # Concurrency is job-scoped deliberately: unauthorized/bot issue-comment
    # events fail the job-level `if` before they can enter an authorized group.
    # Planning commands use one group per owner comment; canonical work remains
    # serialized per implementation issue.
    concurrency:
      group: agent-command-broker-${{ (vars.AGENT_BROKER_PLANNING_ISSUE != '' && format('{0}', github.event.issue.number) == vars.AGENT_BROKER_PLANNING_ISSUE) && format('planning-{0}', github.event.comment.id) || format('issue-{0}', github.event.issue.number) }}
      cancel-in-progress: false
    runs-on: [self-hosted, ci-standard]
    timeout-minutes: 10

    env:
      AGENT_BROKER_OWNER: ${{ vars.AGENT_BROKER_OWNER || github.repository_owner }}
      AGENT_BOT_NAME: ${{ vars.AGENT_BOT_NAME || '' }}
      AGENT_BOT_EMAIL: ${{ vars.AGENT_BOT_EMAIL || '' }}
      AGENT_BROKER_BRANCH_PATTERN: ${{ vars.AGENT_BROKER_BRANCH_PATTERN || '' }}
      AGENT_BROKER_BRANCH_RE: ${{ vars.AGENT_BROKER_BRANCH_RE || '' }}
      AGENT_BROKER_PLANNING_ISSUE: ${{ vars.AGENT_BROKER_PLANNING_ISSUE || '' }}

    steps:
      # Security boundary: issue_comment workflows execute the workflow definition
      # from the default branch. Pin the checked-out broker implementation to the
      # same trusted event SHA and never check out candidate branch/blob contents.
      - name: Checkout trusted broker implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Preflight broker request before credential minting
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/agent-command-broker.py validate
          --event "${GITHUB_EVENT_PATH}"
          --output "${RUNNER_TEMP}/agent-broker-request.json"

      - name: Verify GitHub App bootstrap configuration exists
        env:
          AGENT_GITHUB_APP_ID: ${{ vars.AGENT_GITHUB_APP_ID }}
        run: |
          set -euo pipefail
          test -n "${AGENT_GITHUB_APP_ID}" || {
            echo "ERROR: repository variable AGENT_GITHUB_APP_ID is not configured" >&2
            exit 1
          }

      # The private key never reaches candidate inputs. The action masks the
      # installation token and revokes it automatically at job completion.
      - name: Mint short-lived GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AGENT_GITHUB_APP_ID }}
          private-key: ${{ secrets.AGENT_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Revalidate and author change as GitHub App
        env:
          AGENT_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          python3 scripts/agent-command-broker.py execute
          --request "${RUNNER_TEMP}/agent-broker-request.json"
